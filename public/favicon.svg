<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <!-- Outer plate rim -->
  <circle cx="50" cy="50" r="35" fill="white" stroke="url(#gp)" stroke-width="3.5"/>
  <!-- Inner plate -->
  <circle cx="50" cy="50" r="28" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <!-- Plate inner ring -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="#dcfce7" stroke-width="1" stroke-dasharray="3 2.5"/>
  <!-- Fork -->
  <g transform="translate(50,50) rotate(-20) translate(-50,-50)">
    <rect x="48" y="14" width="4" height="40" rx="2" fill="url(#gl)"/>
    <rect x="45.5" y="6" width="2.5" height="13" rx="1" fill="url(#gl)"/>
    <rect x="48.75" y="4.5" width="2.5" height="13" rx="1" fill="url(#gl)"/>
    <rect x="52" y="6" width="2.5" height="13" rx="1" fill="url(#gl)"/>
  </g>
  <!-- Spoon -->
  <g transform="translate(50,50) rotate(22) translate(-50,-50)">
    <ellipse cx="50" cy="10" rx="9" ry="11" fill="#f0fdf4" stroke="url(#gl)" stroke-width="2.5"/>
    <rect x="48" y="20" width="4" height="36" rx="2" fill="url(#gl)"/>
  </g>
</svg>
