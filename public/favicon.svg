<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="dr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c1810"/>
      <stop offset="50%" stop-color="#1a0f08"/>
      <stop offset="100%" stop-color="#3d2317"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="50%" stop-color="#f0d68a"/>
      <stop offset="100%" stop-color="#b8922e"/>
    </linearGradient>
    <radialGradient id="pw" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#e8e4dc"/>
    </radialGradient>
    <linearGradient id="sv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="30%" stop-color="#d4d4d4"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="70%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#7a7a7a"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="30%" stop-color="#e8e8e8"/>
      <stop offset="60%" stop-color="#a0a0a0"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
    <radialGradient id="sb" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="40%" stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#909090"/>
    </radialGradient>
  </defs>

  <!-- Outer dark rim -->
  <circle cx="50" cy="50" r="48" fill="url(#dr)"/>
  <!-- Gold accent ring -->
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="url(#gr)" stroke-width="1.2"/>
  <!-- Inner dark rim -->
  <circle cx="50" cy="50" r="44" fill="url(#dr)"/>
  <!-- Gold inner ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#gr)" stroke-width="0.8"/>

  <!-- Plate surface -->
  <circle cx="50" cy="50" r="41" fill="url(#pw)"/>

  <!-- Brown rice -->
  <ellipse cx="32" cy="46" rx="10" ry="7" fill="#A0522D"/>
  <ellipse cx="31" cy="44" rx="8" ry="6" fill="#CD853F"/>

  <!-- Spinach -->
  <path d="M60 38 Q66 33 70 37 Q73 42 68 46 Q63 48 60 43Z" fill="#3a9d5e"/>

  <!-- Fork -->
  <g transform="translate(50,50) rotate(-25) translate(-50,-50)">
    <rect x="48.5" y="22" width="3" height="30" rx="1.5" fill="url(#sh)"/>
    <rect x="46" y="14" width="2" height="12" rx="1" fill="url(#sv)"/>
    <rect x="48.5" y="13" width="2" height="12" rx="1" fill="#e8e8e8"/>
    <rect x="51" y="14" width="2" height="12" rx="1" fill="url(#sv)"/>
  </g>

  <!-- Spoon -->
  <g transform="translate(50,50) rotate(22) translate(-50,-50)">
    <rect x="48.5" y="24" width="3" height="28" rx="1.5" fill="url(#sh)"/>
    <ellipse cx="50" cy="16" rx="6" ry="8" fill="url(#sb)"/>
    <ellipse cx="48" cy="13" rx="3.5" ry="4" fill="white" opacity="0.4"/>
  </g>
</svg>