<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 235" fill="none">
  <defs>
    <!-- Realistic plate gradients -->
    <radialGradient id="plateShadow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.12)"/>
      <stop offset="70%" stop-color="rgba(0,0,0,0.04)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <radialGradient id="plateRim" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <radialGradient id="plateBase" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <radialGradient id="plateInnerGlow" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- Realistic silverware gradients -->
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="silverVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="silverHandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="spoonBowl" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <!-- Green brand accent -->
    <linearGradient id="brandGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- ===== SHADOW ===== -->
  <ellipse cx="100" cy="145" rx="60" ry="10" fill="url(#plateShadow)"/>

  <!-- ===== PLATE OUTER RIM ===== -->
  <circle cx="100" cy="100" r="60" fill="url(#plateRim)"/>
  <!-- Rim outer edge highlight -->
  <circle cx="100" cy="100" r="59.5" fill="none" stroke="white" stroke-width="0.8" opacity="0.6"/>
  <!-- Rim inner edge shadow -->
  <circle cx="100" cy="100" r="52" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.4"/>

  <!-- ===== PLATE INNER BASE ===== -->
  <circle cx="100" cy="100" r="51" fill="url(#plateBase)"/>
  <!-- Inner shadow ring -->
  <circle cx="100" cy="100" r="48" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="6"/>
  <!-- Decorative ring -->
  <circle cx="100" cy="100" r="38" fill="none" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="4 3"/>
  <!-- Center bottom shadow -->
  <circle cx="100" cy="106" r="25" fill="rgba(0,0,0,0.03)"/>
  <!-- Highlight reflection -->
  <ellipse cx="88" cy="82" rx="22" ry="12" fill="white" opacity="0.35" transform="rotate(-15,88,82)"/>

  <!-- ===== FORK ===== -->
  <g transform="translate(100,100) rotate(-18) translate(-100,-100)">
    <!-- Fork handle shadow -->
    <rect x="97" y="44" width="8" height="54" rx="3" fill="rgba(0,0,0,0.08)"/>
    <!-- Fork handle -->
    <rect x="96" y="43" width="8" height="55" rx="3" fill="url(#silverHandle)"/>
    <!-- Handle highlight line -->
    <line x1="98.5" y1="48" x2="98.5" y2="88" stroke="white" stroke-width="0.6" opacity="0.5"/>
    <line x1="101.5" y1="48" x2="101.5" y2="88" stroke="#64748b" stroke-width="0.3" opacity="0.3"/>
    <!-- Fork neck -->
    <rect x="96" y="38" width="8" height="8" rx="2" fill="url(#silverVert)"/>
    <!-- Fork neck highlight -->
    <ellipse cx="100" cy="40" rx="3" ry="2" fill="white" opacity="0.3"/>
    <!-- Fork prongs -->
    <rect x="91.5" y="24" width="4" height="18" rx="1.5" fill="url(#silver)"/>
    <rect x="96.5" y="22" width="4" height="18" rx="1.5" fill="url(#silverLight)"/>
    <rect x="101.5" y="24" width="4" height="18" rx="1.5" fill="url(#silver)"/>
    <!-- Prong highlights -->
    <line x1="93" y1="27" x2="93" y2="38" stroke="white" stroke-width="0.4" opacity="0.3"/>
    <line x1="103" y1="27" x2="103" y2="38" stroke="white" stroke-width="0.4" opacity="0.3"/>
    <!-- Prong tips -->
    <ellipse cx="93.5" cy="24.5" rx="1.8" ry="1" fill="#cbd5e1"/>
    <ellipse cx="98.5" cy="22.5" rx="1.8" ry="1" fill="#e2e8f0"/>
    <ellipse cx="103.5" cy="24.5" rx="1.8" ry="1" fill="#cbd5e1"/>
  </g>

  <!-- ===== SPOON ===== -->
  <g transform="translate(100,100) rotate(20) translate(-100,-100)">
    <!-- Spoon handle shadow -->
    <rect x="97" y="50" width="8" height="52" rx="3" fill="rgba(0,0,0,0.08)"/>
    <!-- Spoon handle -->
    <rect x="96" y="49" width="8" height="52" rx="3" fill="url(#silverHandle)"/>
    <!-- Handle highlights -->
    <line x1="98.5" y1="54" x2="98.5" y2="92" stroke="white" stroke-width="0.6" opacity="0.5"/>
    <line x1="101.5" y1="54" x2="101.5" y2="92" stroke="#64748b" stroke-width="0.3" opacity="0.3"/>
    <!-- Spoon neck -->
    <rect x="96" y="44" width="8" height="8" rx="2" fill="url(#silverVert)"/>
    <!-- Spoon bowl outer -->
    <ellipse cx="100" cy="31" rx="13" ry="16" fill="url(#spoonBowl)"/>
    <!-- Rim highlight -->
    <ellipse cx="100" cy="31" rx="12.5" ry="15.5" fill="none" stroke="white" stroke-width="0.4" opacity="0.3"/>
    <!-- Bowl inner reflection -->
    <ellipse cx="96" cy="26" rx="8" ry="9" fill="white" opacity="0.5"/>
    <ellipse cx="94" cy="23" rx="4" ry="3" fill="white" opacity="0.3"/>
    <!-- Bowl bottom shadow -->
    <ellipse cx="102" cy="40" rx="6" ry="3" fill="rgba(0,0,0,0.06)"/>
  </g>

  <!-- ===== GREEN LEAF ACCENT ===== -->
  <g transform="translate(150, 62) scale(1)">
    <path d="M0 0 Q14 -14 12 -26 Q8 -38 -5 -34 Q-12 -28 -3 -18 Q-10 -8 0 0Z" fill="url(#brandGreen)"/>
    <path d="M-1-4 Q4-16 2-24" stroke="#14532d" stroke-width="0.6" fill="none" opacity="0.3"/>
    <!-- Leaf highlight -->
    <path d="M-2-8 Q1-14 0-20" stroke="white" stroke-width="0.5" fill="none" opacity="0.15"/>
  </g>
  <circle cx="158" cy="78" r="1.5" fill="#22c55e" opacity="0.4"/>
  <circle cx="163" cy="72" r="1" fill="#22c55e" opacity="0.25"/>

  <!-- ===== BRAND TEXT ===== -->
  <text x="100" y="180" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" font-weight="800" fill="#15803d" letter-spacing="1.5">Warung</text>
  <text x="100" y="205" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="21" font-weight="800" fill="#15803d" letter-spacing="1.5">Nutrisi</text>
  <text x="100" y="225" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="6.5" font-weight="600" fill="#94a3b8" letter-spacing="4">MAKAN BERGIZI GRATIS</text>
</svg>
