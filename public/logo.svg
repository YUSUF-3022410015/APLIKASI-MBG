<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="darkRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c1810"/>
      <stop offset="50%" stop-color="#1a0f08"/>
      <stop offset="100%" stop-color="#3d2317"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="50%" stop-color="#f0d68a"/>
      <stop offset="100%" stop-color="#b8922e"/>
    </linearGradient>
    <radialGradient id="plateWhite" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#e8e4dc"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8a8a"/>
      <stop offset="30%" stop-color="#d4d4d4"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="70%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#7a7a7a"/>
    </linearGradient>
    <linearGradient id="silverHandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="30%" stop-color="#e8e8e8"/>
      <stop offset="60%" stop-color="#a0a0a0"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
    <radialGradient id="spoonBowl" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="40%" stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#909090"/>
    </radialGradient>
  </defs>

  <!-- Outer dark rim -->
  <circle cx="100" cy="100" r="96" fill="url(#darkRim)"/>
  <!-- Gold accent ring -->
  <circle cx="100" cy="100" r="91" fill="none" stroke="url(#goldRim)" stroke-width="2"/>
  <!-- Inner dark rim -->
  <circle cx="100" cy="100" r="88" fill="url(#darkRim)"/>
  <!-- Gold inner ring -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldRim)" stroke-width="1.5"/>

  <!-- Plate white surface -->
  <circle cx="100" cy="100" r="82" fill="url(#plateWhite)"/>
  <!-- Plate inner shadow -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>

  <!-- Brown rice pile (left) -->
  <ellipse cx="62" cy="88" rx="22" ry="16" fill="#8B4513"/>
  <ellipse cx="60" cy="85" rx="20" ry="14" fill="#A0522D"/>
  <ellipse cx="58" cy="82" rx="18" ry="12" fill="#CD853F"/>
  <!-- Rice grain details -->
  <line x1="50" y1="80" x2="54" y2="84" stroke="#6B3410" stroke-width="1" opacity="0.5"/>
  <line x1="55" y1="78" x2="59" y2="82" stroke="#6B3410" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="77" x2="64" y2="81" stroke="#6B3410" stroke-width="1" opacity="0.5"/>
  <line x1="65" y1="78" x2="68" y2="82" stroke="#6B3410" stroke-width="1" opacity="0.5"/>
  <line x1="52" y1="84" x2="56" y2="88" stroke="#6B3410" stroke-width="1" opacity="0.5"/>
  <line x1="57" y1="83" x2="61" y2="87" stroke="#6B3410" stroke-width="1" opacity="0.5"/>
  <line x1="62" y1="83" x2="66" y2="87" stroke="#6B3410" stroke-width="1" opacity="0.5"/>

  <!-- Spinach leaves (right) -->
  <path d="M118 70 Q130 60 140 68 Q148 76 138 86 Q128 92 118 82 Q112 74 118 70Z" fill="#2d8a4e"/>
  <path d="M120 72 Q128 64 136 70 Q142 76 134 84 Q126 88 120 80 Q116 76 120 72Z" fill="#3a9d5e"/>
  <path d="M122 74 Q128 68 134 73 Q138 78 132 83 Q126 86 122 80 Q120 77 122 74Z" fill="#4ab86e" opacity="0.8"/>
  <!-- Leaf veins -->
  <path d="M125 70 Q130 76 128 84" stroke="#1d6b3a" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M130 72 Q133 78 130 84" stroke="#1d6b3a" stroke-width="0.6" fill="none" opacity="0.3"/>

  <!-- Cherry tomato 1 -->
  <circle cx="90" cy="100" r="8" fill="#cc3333"/>
  <circle cx="88" cy="97" r="6" fill="#e04040"/>
  <ellipse cx="86" cy="95" rx="3" ry="2" fill="#ff6666" opacity="0.6"/>
  <path d="M88 92 Q90 90 92 92" stroke="#2d8a4e" stroke-width="1.5" fill="none"/>

  <!-- Cherry tomato 2 -->
  <circle cx="78" cy="108" r="7" fill="#cc3333"/>
  <circle cx="76" cy="106" r="5" fill="#e04040"/>
  <ellipse cx="75" cy="104" rx="2.5" ry="1.8" fill="#ff6666" opacity="0.6"/>

  <!-- Chickpeas -->
  <circle cx="95" cy="112" r="5" fill="#d4a843"/>
  <circle cx="94" cy="111" r="4" fill="#e0b84d"/>
  <circle cx="88" cy="115" r="4.5" fill="#c99a3a"/>
  <circle cx="87" cy="114" r="3.5" fill="#d4a843"/>
  <circle cx="101" cy="114" r="4" fill="#c99a3a"/>
  <circle cx="100" cy="113" r="3" fill="#d4a843"/>

  <!-- Pumpkin seeds -->
  <ellipse cx="96" cy="72" rx="4" ry="2.5" fill="#5a7a3a" transform="rotate(-15,96,72)"/>
  <ellipse cx="102" cy="70" rx="3.5" ry="2" fill="#4a6a2e" transform="rotate(10,102,70)"/>
  <ellipse cx="108" cy="73" rx="3" ry="2" fill="#5a7a3a" transform="rotate(-5,108,73)"/>

  <!-- FORK (left, rotated slightly) -->
  <g transform="translate(100,100) rotate(-25) translate(-100,-100)">
    <!-- Handle -->
    <rect x="97" y="55" width="6" height="45" rx="3" fill="url(#silverHandle)"/>
    <line x1="99" y1="58" x2="99" y2="95" stroke="white" stroke-width="0.5" opacity="0.4"/>
    <!-- Neck -->
    <rect x="97" y="48" width="6" height="10" rx="2" fill="url(#silver)"/>
    <!-- Prongs -->
    <rect x="92" y="30" width="3" height="22" rx="1.5" fill="url(#silver)"/>
    <rect x="96.5" y="28" width="3" height="22" rx="1.5" fill="#e0e0e0"/>
    <rect x="101" y="30" width="3" height="22" rx="1.5" fill="url(#silver)"/>
    <rect x="105.5" y="30" width="3" height="22" rx="1.5" fill="url(#silver)"/>
    <!-- Prong tips -->
    <ellipse cx="93.5" cy="31" rx="1.5" ry="1" fill="#c0c0c0"/>
    <ellipse cx="98" cy="29" rx="1.5" ry="1" fill="#d8d8d8"/>
    <ellipse cx="102.5" cy="31" rx="1.5" ry="1" fill="#c0c0c0"/>
    <ellipse cx="107" cy="31" rx="1.5" ry="1" fill="#c0c0c0"/>
  </g>

  <!-- SPOON (right, rotated slightly) -->
  <g transform="translate(100,100) rotate(22) translate(-100,-100)">
    <!-- Handle -->
    <rect x="97" y="52" width="6" height="48" rx="3" fill="url(#silverHandle)"/>
    <line x1="99" y1="55" x2="99" y2="95" stroke="white" stroke-width="0.5" opacity="0.4"/>
    <!-- Neck -->
    <rect x="97" y="44" width="6" height="10" rx="2" fill="url(#silver)"/>
    <!-- Bowl -->
    <ellipse cx="100" cy="30" rx="12" ry="15" fill="url(#spoonBowl)"/>
    <ellipse cx="96" cy="25" rx="7" ry="8" fill="white" opacity="0.5"/>
    <ellipse cx="94" cy="22" rx="3.5" ry="3" fill="white" opacity="0.3"/>
  </g>

  <!-- Text -->
  <text x="100" y="152" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="700" fill="#1a0f08" letter-spacing="2">WARUNG</text>
  <text x="100" y="176" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="700" fill="#1a0f08" letter-spacing="2">NUTRISI</text>
</svg>